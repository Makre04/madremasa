spring.application.name=madremasa
server.port=8080

# Se desactiva la caché de plantillas para ver los cambios sin reiniciar
spring.thymeleaf.cache=false

# La sesión se maneja solo con cookie para que no aparezca ";jsessionid" en la URL
server.servlet.session.tracking-modes=cookie

# La sesión se cierra después de 30 minutos de inactividad (RNF-04)
server.servlet.session.timeout=30m

# ---------------------------------------------------------------------
# Conexión con SQL Server
# Las credenciales NO se guardan en este archivo ni en el repositorio:
# se leen de variables de entorno o del archivo local credenciales-bd.properties,
# que está excluido en .gitignore (ver credenciales-bd.properties.ejemplo).
# ---------------------------------------------------------------------
spring.config.import=optional:file:./credenciales-bd.properties
spring.datasource.url=jdbc:sqlserver://${DB_SERVIDOR:localhost}:${DB_PUERTO:1433};databaseName=MadreMasa;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CONTRASENA}

# La estructura de la base se crea con database/MadreMasa_BD.sql; JPA no la modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
