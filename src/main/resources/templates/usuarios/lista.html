<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | Madre Masa</title>
    <link rel="stylesheet" href="../../static/css/estilos.css" th:href="@{/css/estilos.css}">
</head>
<body>
    <header th:replace="~{fragmentos/plantilla :: encabezado('usuarios')}"></header>

    <main class="contenedor contenedor-ancho">
        <div class="titulo-con-accion">
            <h1>Usuarios</h1>
            <a class="boton" th:href="@{/usuarios/nuevo}" href="formulario.html">Nuevo empleado</a>
        </div>
        <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>

        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                    <tr><th>Código</th><th>Nombre</th><th>Rol</th><th>Estado</th><th>Acción</th></tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}" th:classappend="${!u.activo} ? 'fila-inactiva'">
                        <td th:text="${u.codigoEmpleado}">EMP-001</td>
                        <td th:text="${u.nombreCompleto}">Administradora de prueba</td>
                        <td th:text="${u.rol.nombreVisible}">Administrador</td>
                        <td>
                            <span class="etiqueta etiqueta-ok" th:if="${u.activo}">Activo</span>
                            <span class="etiqueta" th:unless="${u.activo}">Inactivo</span>
                        </td>
                        <td>
                            <a th:href="@{/usuarios/{id}/editar(id=${u.idUsuario})}" href="formulario.html">Editar</a>
                            <form class="form-eliminar" th:action="@{/usuarios/{id}/estado(id=${u.idUsuario})}" method="post"
                                  th:unless="${u.idUsuario == session.usuarioId}">
                                <input type="hidden" name="_csrf" th:value="${csrfToken}">
                                <button type="submit" class="enlace-eliminar" th:text="${u.activo} ? 'Desactivar' : 'Activar'">Desactivar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <p class="nota">Las contraseñas se guardan cifradas con BCrypt y nunca se muestran. Un código desactivado no se
            reasigna a otra persona.</p>
    </main>

    <footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
</body>
</html>
