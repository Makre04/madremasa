<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corregir cierre | Madre Masa</title>
    <link rel="stylesheet" href="../../static/css/estilos.css" th:href="@{/css/estilos.css}">
</head>
<body>
    <header th:replace="~{fragmentos/plantilla :: encabezado('cierres')}"></header>

    <main class="contenedor contenedor-ancho">
        <h1>Corregir cierre de jornada</h1>
        <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>

        <!-- RF-22: el administrador corrige montos y unidades; el punto y la fecha no cambian (RN-15) -->
        <section class="tarjeta-formulario">
            <h2><span th:text="${cierre.puntoVenta.nombre}">Feria A</span>
                (<span th:text="${#temporals.format(cierre.fecha, 'dd/MM/yyyy')}">16/11/2026</span>),
                registrado por <span th:text="${cierre.usuario.codigoEmpleado}">EMP-003</span></h2>
            <form th:action="@{/cierres/{id}/corregir(id=${cierre.idCierre})}" method="post">
                <input type="hidden" name="_csrf" th:value="${csrfToken}">
                <div class="tabla-contenedor">
                    <table class="tabla">
                        <thead><tr><th>Producto</th><th class="numero">Unidades vendidas</th></tr></thead>
                        <tbody>
                            <tr th:each="p, estado : ${productos}">
                                <td>
                                    <label th:for="${'unidades' + estado.index}" th:text="${p.nombre}">Pan de masa madre clásico</label>
                                    <input type="hidden" name="idProducto" th:value="${p.idProducto}">
                                </td>
                                <td class="numero">
                                    <input type="number" th:id="${'unidades' + estado.index}" name="unidades" min="0" step="1"
                                           th:value="${unidades.containsKey(p.idProducto) ? unidades.get(p.idProducto) : 0}"
                                           required class="entrada-corta">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="campo-doble">
                    <div class="campo">
                        <label for="efectivo">Cobrado en efectivo (₡)</label>
                        <input type="number" id="efectivo" name="efectivo" min="0" step="0.01" required
                               th:value="${cierre.montoEfectivo}">
                    </div>
                    <div class="campo">
                        <label for="datafono">Cobrado por datáfono (₡)</label>
                        <input type="number" id="datafono" name="datafono" min="0" step="0.01" required
                               th:value="${cierre.montoDatafono}">
                    </div>
                </div>
                <div class="acciones">
                    <a class="boton-secundario" th:href="@{/cierres}" href="#">Cancelar</a>
                    <button type="submit">Guardar corrección</button>
                </div>
            </form>
        </section>
    </main>

    <footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
</body>
</html>
