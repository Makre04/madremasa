<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insumo | Madre Masa</title>
    <link rel="stylesheet" href="../../static/css/estilos.css" th:href="@{/css/estilos.css}">
</head>
<body>
    <header th:replace="~{fragmentos/plantilla :: encabezado('insumos')}"></header>

    <main class="contenedor">
        <h1 th:text="${insumo.idInsumo == null} ? 'Nuevo insumo' : 'Editar insumo'">Nuevo insumo</h1>

        <section class="tarjeta-formulario">
            <form th:action="@{/insumos/guardar}" th:object="${insumo}" method="post" novalidate>
                <input type="hidden" th:field="*{idInsumo}">

                <div class="campo">
                    <label for="nombre">Nombre del insumo</label>
                    <input type="text" id="nombre" th:field="*{nombre}" maxlength="80" required
                           th:classappend="${#fields.hasErrors('nombre')} ? 'campo-invalido'">
                    <p class="campo-error campo-error-servidor" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Ingrese el nombre del insumo</p>
                </div>

                <div class="campo">
                    <label for="idUnidad">Unidad de medida</label>
                    <select id="idUnidad" th:field="*{idUnidad}" required
                            th:classappend="${#fields.hasErrors('idUnidad')} ? 'campo-invalido'">
                        <option value="">Seleccione una unidad</option>
                        <option th:each="u : ${unidades}" th:value="${u.idUnidad}"
                                th:text="${u.nombre + ' (' + u.simbolo + ')'}">Gramo (g)</option>
                    </select>
                    <p class="campo-error campo-error-servidor" th:if="${#fields.hasErrors('idUnidad')}" th:errors="*{idUnidad}">Seleccione la unidad de medida</p>
                </div>

                <div class="campo-doble">
                    <div class="campo">
                        <label for="cantidadMinima">Cantidad mínima</label>
                        <input type="number" id="cantidadMinima" th:field="*{cantidadMinima}" min="0" step="0.001" required
                               th:classappend="${#fields.hasErrors('cantidadMinima')} ? 'campo-invalido'">
                        <p class="campo-error campo-error-servidor" th:if="${#fields.hasErrors('cantidadMinima')}" th:errors="*{cantidadMinima}">Ingrese la cantidad mínima</p>
                    </div>
                    <div class="campo">
                        <label for="costoUnitario">Costo unitario (₡)</label>
                        <input type="number" id="costoUnitario" th:field="*{costoUnitario}" min="0" step="0.0001" required
                               th:classappend="${#fields.hasErrors('costoUnitario')} ? 'campo-invalido'">
                        <p class="campo-error campo-error-servidor" th:if="${#fields.hasErrors('costoUnitario')}" th:errors="*{costoUnitario}">Ingrese el costo unitario</p>
                    </div>
                </div>

                <div class="campo campo-casilla">
                    <input type="checkbox" id="activo" th:field="*{activo}">
                    <label for="activo">Insumo activo</label>
                </div>

                <p class="nota">La existencia no se edita aquí: cambia solo con entradas, ajustes y producciones.</p>

                <div class="acciones">
                    <a class="boton-secundario" th:href="@{/insumos}" href="lista.html">Cancelar</a>
                    <button type="submit">Guardar</button>
                </div>
            </form>
        </section>
    </main>

    <footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
</body>
</html>
