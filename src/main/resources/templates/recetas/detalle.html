<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de receta | Madre Masa</title>
    <link rel="stylesheet" href="../../static/css/estilos.css" th:href="@{/css/estilos.css}">
</head>
<body>
    <header th:replace="~{fragmentos/plantilla :: encabezado('recetas')}"></header>

    <main class="contenedor">
        <h1 th:text="${receta.producto.nombre}">Pan de masa madre clásico</h1>
        <p>Rendimiento: <strong th:text="${receta.rendimiento}">12</strong> unidades por tanda.</p>
        <p class="nota" th:if="${receta.instrucciones}" th:text="${receta.instrucciones}">Instrucciones de la receta.</p>

        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                    <tr><th>Insumo</th><th class="numero">Cantidad por tanda</th>
                        <th class="numero" sec:authorize="hasRole('ADMINISTRADOR')">Costo</th></tr>
                </thead>
                <tbody>
                    <tr th:each="d : ${receta.detalles}">
                        <td th:text="${d.insumo.nombre}">Harina de trigo</td>
                        <td class="numero"><span th:text="${#numbers.formatInteger(d.cantidad, 1, 'POINT')}">6.000</span> <span th:text="${d.insumo.unidad.simbolo}">g</span></td>
                        <td class="numero" sec:authorize="hasRole('ADMINISTRADOR')">₡<span th:text="${#numbers.formatDecimal(d.costo, 1, 'POINT', 2, 'COMMA')}">5.700,00</span></td>
                    </tr>
                </tbody>
                <tfoot sec:authorize="hasRole('ADMINISTRADOR')">
                    <tr><th>Costo por tanda</th><th></th>
                        <th class="numero">₡<span th:text="${#numbers.formatDecimal(costos.costoPorTanda(receta), 1, 'POINT', 2, 'COMMA')}">6.380,40</span></th></tr>
                    <tr><th>Costo por unidad</th><th></th>
                        <th class="numero">₡<span th:text="${#numbers.formatDecimal(costos.costoPorUnidad(receta), 1, 'POINT', 2, 'COMMA')}">531,70</span></th></tr>
                </tfoot>
            </table>
        </div>
        <a class="enlace-volver" th:href="@{/recetas}" href="lista.html">← Volver a recetas</a>
    </main>

    <footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
</body>
</html>
